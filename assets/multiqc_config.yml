report_comment: >
  This report has been generated by the <a href="https://github.com/nf-core/seqinspector/releases/tag/1.1.1" target="_blank">nf-core/seqinspector</a> analysis pipeline. For information about how to interpret these results, please see the <a href="https://nf-co.re/seqinspector/1.1.1/docs/output" target="_blank">documentation</a>. If ToulligQC was used, a separate report is available in the results folder.
report_section_order:
  "subsampling-notice":
    order: 1000
  "nf-core-seqinspector-index":
    order: -999
  "nf-core-seqinspector-methods-description":
    order: -1000
  multiqc_software_versions:
    order: -1001
  "nf-core-seqinspector-summary":
    order: -1002

export_plots: true

# Set static output file names for the report, data and plots directories so these
# are not changed when "--multiqc_title" is specified, required for index section to work properly
output_fn_name: "multiqc_report.html"
data_dir_name: "multiqc_data"
plots_dir_name: "multiqc_plots"

disable_version_detection: true

fn_clean_trim:
  - "_screen" # Added by FastqScreen
  - ".json"

# Make sample name with indexes a bit prettier
# for SE: "SampleName_01" -> "SampleName #01"
# for PE: "SampleName_01_1" -> "SampleName #01_1"
#    and: "SampleName_01_2" -> "SampleName #01_2"
sample_names_replace_regex: true
sample_names_replace:
  "(.+)_(\\d{2,}|\\d{2,}_[12])$": "\\1 #\\2"

table_sample_merge:
  "Read1":
    - type: regex
      pattern: "_1$"
  "Read2":
    - type: regex
      pattern: "_2$"

use_filename_as_sample_name:
  - "sequali"
