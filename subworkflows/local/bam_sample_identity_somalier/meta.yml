# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "bam_sample_identity_somalier"
description: Sample identity, relatedness, contamination and sex of aligned BAM files with somalier
keywords:
  - bam
  - contamination
  - identity
  - relatedness
  - sample swap
  - sex
  - somalier
components:
  - samtools/coverage
  - somalier/contamination
  - somalier/extract
  - somalier/relate
  - somaliercontam/attribute
  - somaliercontam/identity
  - somaliercontam/report
input:
  - ch_bam_bai:
      type: file
      description: |
        Aligned BAM files with index. The meta map holds `id`, `tags`, `individual`, `batch` and `sex`.
        Structure: [ val(meta), path(bam), path(bai) ]
  - ch_fasta:
      type: file
      description: |
        Reference genome FASTA
        Structure: [ val(meta), path(fasta) ]
  - ch_fai:
      type: file
      description: |
        Index of the reference genome FASTA
        Structure: [ val(meta), path(fai) ]
  - ch_sites:
      type: file
      description: |
        VCF file with the polymorphic sites somalier extracts
        Structure: [ val(meta), path(vcf) ]
  - ch_background:
      type: file
      description: |
        somalier digests of samples that are only candidate contamination sources. The meta map holds `id` and `individual`.
        Structure: [ val(meta), path(somalier) ]
  - run_contamination:
      type: boolean
      description: Estimate contamination and attribute it to a source sample
  - attribution_chunk_size:
      type: integer
      description: Number of samples per source attribution task
  - run_sexcheck:
      type: boolean
      description: Compare the annotated sex with the sex inferred from chrY reads and X heterozygosity
output:
  - extract:
      type: file
      description: |
        somalier digest of each sample
        Structure: [ val(meta), path(somalier) ]
  - contamination:
      type: file
      description: |
        Per sample contamination calls, pair tables and heatmap of all batches
        Structure: [ val(meta), path(file) ]
authors:
  - "@apeltzer"
maintainers:
  - "@apeltzer"
