# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: somaliercontam_identity
description:
  Hom-hom discordance between samples from somalier allele counts and grouping of samples into genotype (individual)
  groups
keywords:
  - identity
  - relatedness
  - somalier
  - sample swap
  - longitudinal
tools:
  - somalier_contam:
      description: Contamination-source attribution and sample identity on top of somalier allele counts
      homepage: https://github.com/nf-core/seqinspector
      documentation: https://nf-co.re/seqinspector/usage
      tool_dev_url: https://github.com/nf-core/seqinspector
      licence:
        - MIT
      identifier: ""
input:
  - - meta:
        type: map
        description: "Groovy Map containing sample information

          e.g. [ id:'sample1' ]

          "
    - extract:
        type: file
        description: List of .somalier files referenced by the sample table (staged as somalier/*)
        pattern: "*.somalier"
        ontologies: []
    - samples:
        type: file
        description: Sample table TSV with columns sample, file, individual, batch, role[, input]
        pattern: "*.tsv"
        ontologies: []
  - - meta2:
        type: map
        description: "Groovy Map containing sites information

          e.g. [ id:'sites' ]

          "
    - sites:
        type: file
        description: somalier sites VCF with INFO/AF (the one used for extract)
        pattern: "*.{vcf,vcf.gz}"
        ontologies:
          - edam: http://edamontology.org/format_3016
output:
  groups:
    - - meta:
          type: map
          description: "Groovy Map containing sample information

            e.g. [ id:'sample1' ]

            "
      - "*.genotype_groups.tsv":
          type: file
          description: Genotype group per sample
          pattern: "*.genotype_groups.tsv"
          ontologies: []
  pairs:
    - - meta:
          type: map
          description: "Groovy Map containing sample information

            e.g. [ id:'sample1' ]

            "
      - "*.identity_pairs.tsv":
          type: file
          description: Pairs expected identical (individual) or genotype-identical, with hom-hom discordance
          pattern: "*.identity_pairs.tsv"
          ontologies: []
  versions_somalier_contam:
    - &id001
      - ${task.process}:
          type: string
          description: The name of the process
      - somalier_contam:
          type: string
          description: The name of the tool
      - somalier_contam.py --version | sed "s/.* //":
          type: eval
          description: The expression to obtain the version of the tool
  versions_python:
    - &id002
      - ${task.process}:
          type: string
          description: The name of the process
      - python:
          type: string
          description: The name of the tool
      - python3 --version | sed "s/Python //":
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - *id001
    - *id002
authors:
  - "@apeltzer"
maintainers:
  - "@apeltzer"
