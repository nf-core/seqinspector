# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: somaliercontam_report
description:
  Merge attribution, identity, somalier relate and somalier contamination results into per-sample contamination
  calls and pair tables, and optionally compare inferred (chrY reads, X heterozygosity) with annotated sex
keywords:
  - contamination
  - report
  - somalier
  - identity
  - sex
tools:
  - somalier_contam:
      description: Contamination-source attribution and sample identity on top of somalier allele counts
      homepage: https://github.com/nf-core/seqinspector
      documentation: https://nf-co.re/seqinspector/usage
      tool_dev_url: https://github.com/nf-core/seqinspector
      licence:
        - MIT
      identifier: ""
input:
  - - meta:
        type: map
        description: "Groovy Map containing sample information

          e.g. [ id:'sample1' ]

          "
    - samples:
        type: file
        description: Sample table TSV with columns sample, file, individual, batch, role[, input]
        pattern: "*.tsv"
        ontologies: []
    - groups:
        type: file
        description: Genotype groups from somaliercontam/identity
        pattern: "*.genotype_groups.tsv"
        ontologies: []
    - identity_pairs:
        type: file
        description: Identity pairs from somaliercontam/identity
        pattern: "*.identity_pairs.tsv"
        ontologies: []
  - - meta2:
        type: map
        description: "Groovy Map

          "
    - attribution_pairs:
        type: file
        description: Attribution pair tables (all shards)
        pattern: "*.attribution_pairs.tsv.gz"
        ontologies: []
    - attribution_self:
        type: file
        description: Attribution per-receiver tables (all shards)
        pattern: "*.attribution_self.tsv"
        ontologies: []
  - - meta3:
        type: map
        description: "Groovy Map

          "
    - relate_samples:
        type: file
        description: somalier relate samples tables
        pattern: "*.samples.tsv"
        ontologies: []
    - relate_pairs:
        type: file
        description: somalier relate pairs tables
        pattern: "*.pairs.tsv"
        ontologies: []
  - - meta4:
        type: map
        description: "Groovy Map

          "
    - contamination_pairs:
        type: file
        description: somalier contamination pairs tables (may be empty)
        pattern: "*.pairs.tsv"
        ontologies: []
  - - meta5:
        type: map
        description: "Groovy Map

          "
    - coverage:
        type: file
        description:
          MAPQ-filtered samtools coverage tables, one per sample named <sample>[.coverage].txt (may be empty).
          Enables the comparison of inferred and annotated sex (sample table column 'sex').
        pattern: "*.txt"
        ontologies: []
output:
  summary:
    - - meta:
          type: map
          description: "Groovy Map containing sample information

            e.g. [ id:'sample1' ]

            "
      - "*.summary.samples.tsv":
          type: file
          description: Per-sample contamination summary and call
          pattern: "*.summary.samples.tsv"
          ontologies: []
  attribution_pairs:
    - - meta:
          type: map
          description: "Groovy Map containing sample information

            e.g. [ id:'sample1' ]

            "
      - "*.attribution.pairs.tsv.gz":
          type: file
          description: Annotated receiver x candidate table
          pattern: "*.attribution.pairs.tsv.gz"
          ontologies: []
  longitudinal:
    - - meta:
          type: map
          description: "Groovy Map containing sample information

            e.g. [ id:'sample1' ]

            "
      - "*.longitudinal.pairs.tsv":
          type: file
          description: Identity checks for expected/observed same-individual pairs
          pattern: "*.longitudinal.pairs.tsv"
          ontologies: []
  flags:
    - - meta:
          type: map
          description: "Groovy Map containing sample information

            e.g. [ id:'sample1' ]

            "
      - "*.relatedness_flags.tsv":
          type: file
          description: Identity mismatches, unexpected identity and elevated relatedness
          pattern: "*.relatedness_flags.tsv"
          ontologies: []
  heatmap:
    - - meta:
          type: map
          description: "Groovy Map containing sample information

            e.g. [ id:'sample1' ]

            "
      - "*.attribution_llr.png":
          type: file
          description: LLR heatmap per batch
          pattern: "*.attribution_llr.png"
          ontologies: []
  multiqc:
    - - meta:
          type: map
          description: "Groovy Map containing sample information

            e.g. [ id:'sample1' ]

            "
      - "${task.process}":
          type: string
          description: The name of the process
      - somalier_contam:
          type: string
          description: The name of the tool
      - "*_mqc.tsv":
          type: file
          description: MultiQC custom content tables
          pattern: "*_mqc.tsv"
          ontologies: []
  versions_somalier_contam:
    - &id001
      - ${task.process}:
          type: string
          description: The name of the process
      - somalier_contam:
          type: string
          description: The name of the tool
      - somalier_contam.py --version | sed "s/.* //":
          type: eval
          description: The expression to obtain the version of the tool
  versions_python:
    - &id002
      - ${task.process}:
          type: string
          description: The name of the process
      - python:
          type: string
          description: The name of the tool
      - python3 --version | sed "s/Python //":
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - *id001
    - *id002
authors:
  - "@apeltzer"
maintainers:
  - "@apeltzer"
