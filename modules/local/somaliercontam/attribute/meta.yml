# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: somaliercontam_attribute
description:
  "Contamination source attribution: mixture log-likelihood ratios of each candidate sample versus an unknown contaminant,
  for a shard of receiver samples"
keywords:
  - contamination
  - source attribution
  - somalier
  - mixture model
tools:
  - somalier_contam:
      description: Contamination-source attribution and sample identity on top of somalier allele counts
      homepage: https://github.com/nf-core/seqinspector
      documentation: https://nf-co.re/seqinspector/usage
      tool_dev_url: https://github.com/nf-core/seqinspector
      licence:
        - MIT
      identifier: ""
input:
  - - meta:
        type: map
        description: "Groovy Map containing shard information

          e.g. [ id:'batch1.shard0', shard_index:0, n_shards:4 ]

          "
    - extract:
        type: file
        description: List of .somalier files referenced by the sample table (staged as somalier/*)
        pattern: "*.somalier"
        ontologies: []
    - samples:
        type: file
        description: Sample table TSV with columns sample, file, individual, batch, role[, input]
        pattern: "*.tsv"
        ontologies: []
  - - meta2:
        type: map
        description: "Groovy Map containing sites information

          e.g. [ id:'sites' ]

          "
    - sites:
        type: file
        description: somalier sites VCF with INFO/AF (the one used for extract)
        pattern: "*.{vcf,vcf.gz}"
        ontologies:
          - edam: http://edamontology.org/format_3016
output:
  pairs:
    - - meta:
          type: map
          description: "Groovy Map containing sample information

            e.g. [ id:'sample1' ]

            "
      - "*.attribution_pairs.tsv.gz":
          type: file
          description: Receiver x candidate attribution statistics
          pattern: "*.attribution_pairs.tsv.gz"
          ontologies: []
  self:
    - - meta:
          type: map
          description: "Groovy Map containing sample information

            e.g. [ id:'sample1' ]

            "
      - "*.attribution_self.tsv":
          type: file
          description: Source-agnostic contamination estimate per receiver
          pattern: "*.attribution_self.tsv"
          ontologies: []
  versions_somalier_contam:
    - &id001
      - ${task.process}:
          type: string
          description: The name of the process
      - somalier_contam:
          type: string
          description: The name of the tool
      - somalier_contam.py --version | sed "s/.* //":
          type: eval
          description: The expression to obtain the version of the tool
  versions_python:
    - &id002
      - ${task.process}:
          type: string
          description: The name of the process
      - python:
          type: string
          description: The name of the tool
      - python3 --version | sed "s/Python //":
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - *id001
    - *id002
authors:
  - "@apeltzer"
maintainers:
  - "@apeltzer"
